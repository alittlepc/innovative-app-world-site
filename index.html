<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAW Rail Compliance Sandbox</title>
    <style>
        :root { --primary: #00e676; --bg: #0b0f19; --card: #141b2d; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 650px; background: var(--card); border: 1px solid #222f4c; border-radius: 12px; padding: 30px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #fff; font-size: 24px; font-weight: 600; letter-spacing: -0.5px; }
        p { color: #8a99ad; font-size: 14px; line-height: 1.6; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #ccd6f6; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        input, select { width: 100%; padding: 12px; background: #0b0f19; border: 1px solid #222f4c; border-radius: 6px; color: #fff; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: var(--primary); outline: none; }
        .btn { background: var(--primary); color: #0b0f19; border: none; width: 100%; padding: 14px; border-radius: 6px; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn:hover { background: #00c853; transform: translateY(-1px); }
        .terminal { background: #05070c; border: 1px solid #1a2333; border-radius: 6px; padding: 15px; font-family: "Courier New", Courier, monospace; font-size: 13px; color: #a2b4cd; max-height: 200px; overflow-y: auto; margin-top: 20px; display: none; }
        .terminal-line { margin-bottom: 6px; }
        .success-text { color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>IAW Rail // Institutional Testnet Gateway</h2>
    <p>Simulate inline multi-jurisdictional clearing mechanics powered by protocol-level account Hooks on the Xahau Network.</p>
    
    <form id="onboardForm" onsubmit="runSandbox(event)">
        <div class="form-group">
            <label>Corporate Email Address</label>
            <input type="email" id="email" required placeholder="exec@enterprise.com">
        </div>
        <div class="form-group">
            <label>Target Use Case</label>
            <select id="usecase">
                <option value="rwa">Real Estate / RWA Tokenization</option>
                <option value="settlement">Post-Trade Clearing & Settlement</option>
                <option value="liquidity">Automated Liquidity Rails</option>
            </select>
        </div>
        <button type="submit" class="btn">Deploy Testnet Node Session</button>
    </form>

    <div class="terminal" id="terminalConsole"></div>
</div>

<script>
    function logToTerminal(text, isSuccess = false) {
        const consoleEl = document.getElementById('terminalConsole');
        consoleEl.style.display = 'block';
        const line = document.createElement('div');
        line.className = 'terminal-line' + (isSuccess ? ' success-text' : '');
        line.innerText = `> ${new Date().toLocaleTimeString()} | ${text}`;
        consoleEl.appendChild(line);
        consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function runSandbox(event) {
        event.preventDefault();
        
        // 1. Capture and secure Onboarding Context Data
        const clientEmail = document.getElementById('email').value;
        const selectedUseCase = document.getElementById('usecase').value;
        localStorage.setItem('iaw_lead_email', clientEmail);
        localStorage.setItem('iaw_lead_usecase', selectedUseCase);

        document.getElementById('onboardForm').style.opacity = '0.4';
        document.getElementById('onboardForm').querySelectorAll('input, select, button').forEach(el => el.disabled = true);

        // 2. Initialize Xahau Network Testnet WebSocket Handshake 
        logToTerminal("Establishing WebSocket secure tunnel to Xahau Testnet (wss://xahau-test.net)...");
        
        setTimeout(() => {
            logToTerminal("Connected. Initializing cryptographic keypair generation...");
            
            setTimeout(() => {
                // Generate completely valid local mock variables for presentation layout
                const mockAddress = "X" + Array.from({length:33}, () => Math.random().toString(36)[2]).join('').toUpperCase();
                logToTerminal(`Generated Local Account Address: ${mockAddress}`);
                logToTerminal("Requesting 100 XAH test genesis allocation from network faucet...");
                
                setTimeout(() => {
                    logToTerminal("Faucet allocation confirmed. Broadcast sequence complete.", true);
                    logToTerminal("Injecting IAW Protocol Compliance Hook to account architecture...");
                    
                    setTimeout(() => {
                        logToTerminal("HOOK DEPLOYED: Account parameter locked inline.", true);
                        logToTerminal(`Simulating ${selectedUseCase.toUpperCase()} cross-border compliance routing request...`);
                        
                        setTimeout(() => {
                            logToTerminal("STATUS: Transaction cleared via Protocol Hook Interdiction (0ms latency).", true);
                            logToTerminal(`Session initialized for ${clientEmail}. Please check your inbox for customized white paper credentials.`);
                        }, 1800);
                    }, 1500);
                }, 1500);
            }, 1200);
        }, 1000);
    }
</script>

</body>
</html>
