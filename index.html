<script>
    const HARDCODED_HARVEST_ADDRESS = "raMQedfvpoGgi1bGjpYc94ka5NH4UA3H7c";

    let vol = 1000000;
    let currentMode = "demo";
    const NETWORK_WS = "wss://xahau-testnet.bithomp.com";
    let client;
    let wallet1, wallet2;

    // --- STEP 1: MATHEMATICAL EVALUATION ENGINE ---
    function calc() {
        // Read raw configuration numbers directly from the input fields
        const rawVolString = document.getElementById('volInput').value;
        vol = parseFloat(rawVolString.replace(/[^0-9.]/g, '')) || 0;

        const taxRate = parseFloat(document.getElementById('taxRange').value) || 0;
        const customRate = parseFloat(document.getElementById('customRange').value) || 0;

        // Update Slider Labels Instantly
        document.getElementById('taxLabel').innerText = taxRate.toFixed(3) + "%";
        document.getElementById('customLabel').innerText = customRate.toFixed(3) + "%";

        // Calculate Absolute Dollar Volumes Based on User Inputs
        const taxVolumeDollar = vol * (taxRate / 100);
        const customVolumeDollar = vol * (customRate / 100);
        
        document.getElementById('taxVolumeLabel').innerText = formatCurrency(taxVolumeDollar);
        document.getElementById('customVolumeLabel').innerText = formatCurrency(customVolumeDollar);

        // Update Train Car Visual UI Badges
        document.getElementById('car-tax-fee').innerText = taxRate.toFixed(2) + "%";
        document.getElementById('car-custom-fee').innerText = customRate.toFixed(2) + "%";

        // --- STEP 2: CONSOLIDATION COMPARISON CALCULATIONS ---
        // IAW Rail consolidated model uses a flat 0.33% engine fee
        const iawEngineFee = vol * 0.0033;
        const iawTotalFriction = iawEngineFee + taxVolumeDollar + customVolumeDollar;

        // Legacy systems incur compounding structural friction (avg 2.5% base layer overhead)
        const legacyBaseFee = vol * 0.025;
        const legacyTotalFriction = legacyBaseFee + taxVolumeDollar + customVolumeDollar;

        // Determine Total Capital Efficiency Saved
        const capitalGain = legacyTotalFriction - iawTotalFriction;

        // --- STEP 3: FLUID TEXT AND TABLE RENDERING ---
        document.getElementById('iawFee').innerText = formatCurrency(iawTotalFriction);
        document.getElementById('legacyFee').innerText = formatCurrency(legacyTotalFriction);
        
        const gainElement = document.getElementById('gain');
        if (capitalGain >= 0) {
            gainElement.innerText = "+" + formatCurrency(capitalGain);
            gainElement.className = "text-4xl font-mono font-black text-green-400 mt-2";
        } else {
            gainElement.innerText = formatCurrency(capitalGain);
            gainElement.className = "text-4xl font-mono font-black text-rose-400 mt-2";
        }

        // Update Matrix Breakdown Rows
        document.getElementById('row1-iaw').innerText = formatCurrency(iawEngineFee);
        document.getElementById('row1-leg').innerText = formatCurrency(legacyBaseFee);

        document.getElementById('row2-iaw').innerText = formatCurrency(taxVolumeDollar);
        document.getElementById('row2-leg').innerText = formatCurrency(taxVolumeDollar);

        document.getElementById('row3-iaw').innerText = formatCurrency(customVolumeDollar);
        document.getElementById('row3-leg').innerText = formatCurrency(customVolumeDollar);

        document.getElementById('total-iaw').innerText = formatCurrency(iawTotalFriction);
        document.getElementById('total-leg').innerText = formatCurrency(legacyTotalFriction);
    }

    function formatCurrency(num) {
        return "$" + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 8 });
    }

    function updateVol(val) {
        // Stripe formatting to keep calculation active during user typing
        const cleanVal = val.replace(/[^0-9.]/g, '');
        vol = parseFloat(cleanVal) || 0;
        calc();
    }

    // Bind clean financial formatting when user clicks out of input box
    document.getElementById('volInput').addEventListener('blur', function(e) {
        e.target.value = formatCurrency(vol).replace('.00000000', '');
    });

    document.getElementById('volInput').addEventListener('focus', function(e) {
        e.target.value = vol > 0 ? vol : '';
    });

    // --- STEP 4: ACCESS CONTROL LAYOVER LOGIC ---
    function isUnlocked() {
        return localStorage.getItem('iaw_lead_unlocked') === 'true';
    }

    function submitGatekeeper(e) {
        e.preventDefault();
        const emailInput = document.getElementById('gatekeeper-email').value;
        const usecaseSelect = document.getElementById('gatekeeper-usecase').value;

        if(!emailInput.includes('@')) {
            alert('Please check your email formatting specifications.');
            return;
        }

        localStorage.setItem('iaw_lead_email', emailInput);
        localStorage.setItem('iaw_lead_usecase', usecaseSelect);
        localStorage.setItem('iaw_lead_unlocked', 'true');

        document.getElementById('testnet-gatekeeper').classList.add('hidden');
        initNetworkConnection();
    }

    function switchMode(mode) {
        currentMode = mode;
        const btnDemo = document.getElementById('toggle-demo');
        const btnTestnet = document.getElementById('toggle-testnet');
        
        const panelDemo = document.getElementById('panel-demo');
        const panelTestnet = document.getElementById('panel-testnet');
        const railsDemo = document.getElementById('rails-demo');
        const railsTestnet = document.getElementById('rails-testnet');
        const viewDemo = document.getElementById('view-demo-matrix');
        const viewTestnet = document.getElementById('view-testnet-console');
        const instructDemo = document.getElementById('instructions-demo');
        const instructTestnet = document.getElementById('instructions-testnet');
        const headerText = document.getElementById('table-header');
        const gatekeeper = document.getElementById('testnet-gatekeeper');

        if(mode === 'demo') {
            btnDemo.className = "px-6 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider transition-all duration-200 bg-white text-blue-600 shadow-sm";
            btnTestnet.className = "px-6 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider transition-all duration-200 text-slate-500 hover:text-slate-800";
            panelDemo.classList.remove('hidden');
            panelTestnet.classList.add('hidden');
            railsDemo.classList.remove('hidden');
            railsTestnet.classList.add('hidden');
            viewDemo.classList.remove('hidden');
            viewTestnet.classList.add('hidden');
            instructDemo.classList.remove('hidden');
            instructTestnet.classList.add('hidden');
            gatekeeper.classList.add('hidden');
            headerText.innerText = "Outflow Distribution Analysis";
            document.getElementById('network-status').innerText = "Offline Simulation";
            document.getElementById('network-status').className = "text-slate-400";
            calc();
        } else {
            btnTestnet.className = "px-6 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider transition-all duration-200 bg-white text-blue-600 shadow-sm";
            btnDemo.className = "px-6 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider transition-all duration-200 text-slate-500 hover:text-slate-800";
            panelDemo.classList.add('hidden');
            panelTestnet.classList.remove('hidden');
            railsDemo.classList.add('hidden');
            railsTestnet.classList.remove('hidden');
            viewDemo.classList.add('hidden');
            viewTestnet.classList.remove('hidden');
            instructDemo.classList.add('hidden');
            instructTestnet.classList.remove('hidden');
            headerText.innerText = "On-Chain Transaction Stream Audit";
            
            if (!isUnlocked()) {
                gatekeeper.classList.remove('hidden');
                document.getElementById('network-status').innerText = "Awaiting Verification";
                document.getElementById('network-status').className = "text-blue-400 font-bold uppercase";
            } else {
                initNetworkConnection();
            }
        }
    }

    function handleRouteSelection() {
        const select = document.getElementById('route-select').value;
        const customField = document.getElementById('custom-address-field');
        if(select.includes('Custom')) {
            customField.classList.remove('hidden');
        } else {
            customField.classList.add('hidden');
        }
    }

    function getXrplLibrary() {
        if (typeof xrpl !== 'undefined') return xrpl;
        if (window.xrpl) return window.xrpl;
        throw new Error("Core network library package is still loading.");
    }

    async function initNetworkConnection() {
        const netStatus = document.getElementById('network-status');
        if (client && client.isConnected()) return;
        
        netStatus.innerText = "Connecting to Xahau Testnet...";
        netStatus.className = "text-amber-500 font-bold uppercase";
        
        try {
            const xrplCore = getXrplLibrary();
            client = new xrplCore.Client(NETWORK_WS);
            await client.connect();
            netStatus.innerText = "Online (Xahau Testnet)";
            netStatus.className = "text-emerald-400 font-black uppercase tracking-wider";
            logStream("Successfully connected to live Xahau Testnet Node.", "success");
            await refreshLedgerBalances();
        } catch(e) {
            netStatus.innerText = "Connection Failed";
            netStatus.className = "text-rose-500 font-bold uppercase";
            logStream(`Network connection failed: ${e.message}`, "error");
        }
    }

    async function generateTestnetAccounts() {
        const genBtn = document.getElementById('btn-generate');
        genBtn.disabled = true;
        genBtn.innerText = "Generating Wallet 1 (Customer)...";
        
        logStream("Requesting allocations from the Xahau Testnet Faucet hub...", "info");

        try {
            await initNetworkConnection();
            const xrplCore = getXrplLibrary();

            wallet1 = xrplCore.Wallet.generate();
            logStream(`Wallet 1 Created: ${wallet1.classicAddress}. Fueling via network callback...`, "info");
            
            const f1 = await fetch(`https://xahau-testnet.bithomp.com/api/v1/faucet?address=${wallet1.classicAddress}`);
            await f1.json();
            
            genBtn.innerText = "Generating Wallet 2 (Merchant)...";
            wallet2 = xrplCore.Wallet.generate();
            logStream(`Wallet 2 Created: ${wallet2.classicAddress}. Fueling via network callback...`, "info");
            
            const f2 = await fetch(`https://xahau-testnet.bithomp.com/api/v1/faucet?address=${wallet2.classicAddress}`);
            await f2.json();

            logStream("Waiting for testnet ledger consensus confirmation...", "info");
            await new Promise(r => setTimeout(r, 4000));

            await refreshLedgerBalances();
            logStream("Both demo wallets are locked, loaded, and initialized with test funds!", "success");

            const fireBtn = document.getElementById('btn-fire');
            fireBtn.removeAttribute('disabled');
            fireBtn.className = "w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-[11px] uppercase tracking-wider py-3.5 rounded-xl shadow-lg cursor-pointer transition";
            genBtn.innerText = "Regenerate Demo Accounts";
            genBtn.disabled = false;
        } catch(err) {
            logStream(`Account provision failed: ${err.message}`, "error");
            genBtn.disabled = false;
            genBtn.innerText = "⚡ 1. Initialize Demo Accounts";
        }
    }

    async function refreshLedgerBalances() {
        if (!client || !client.isConnected()) return;
        try {
            if (wallet1) {
                const b1 = await client.getXrpBalance(wallet1.classicAddress);
                document.getElementById('bal-wallet1').innerText = parseFloat(b1).toFixed(2) + " XAH";
            }
            if (wallet2) {
                const b2 = await client.getXrpBalance(wallet2.classicAddress);
                document.getElementById('bal-wallet2').innerText = parseFloat(b2).toFixed(2) + " XAH";
            }
            const bTreasury = await client.getXrpBalance(HARDCODED_HARVEST_ADDRESS);
            document.getElementById('bal-treasury').innerText = parseFloat(bTreasury).toFixed(2) + " XAH";
        } catch(e) {
            console.error("Balance refresh loop halted:", e);
        }
    }

    function logStream(msg, type="info") {
        const consoleFeed = document.getElementById('console-feed');
        const timestamp = new Date().toLocaleTimeString();
        let colorClass = "text-slate-300";
        if(type === "success") colorClass = "text-emerald-400 font-bold";
        if(type === "error") colorClass = "text-rose-400";
        
        consoleFeed.innerHTML += `<div class="${colorClass}">[${timestamp}] > ${msg}</div>`;
        consoleFeed.scrollTop = consoleFeed.scrollHeight;
    }

    // Initialize layout default computation immediately on application boot
    window.onload = function() {
        calc();
    };
</script>
</body>
</html>
