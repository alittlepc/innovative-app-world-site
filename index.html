<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAW Settlement Rail | Live Gateway</title>
    <script src="https://unpkg.com/xrpl@2.7.0/build/xrpl-latest-min.js"></script>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #111827;
            --border: #1f2937;
            --accent: #3b82f6;
            --success: #10b981;
            --text: #f3f4f6;
            --muted: #9ca3af;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: ui-monospace, monospace;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 600px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 1.6rem; margin: 0; color: #fff; }
        p.subtitle { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
        input { width: 100%; background: #030712; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 6px; font-family: inherit; margin-bottom: 20px; box-sizing: border-box; }
        button { background: var(--accent); color: #fff; border: none; width: 100%; padding: 14px; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s; margin-bottom: 10px; }
        button:hover { background: #2563eb; }
        pre { background: #030712; border: 1px solid var(--border); padding: 15px; border-radius: 6px; font-size: 0.75rem; color: #34d399; height: 160px; overflow-y: auto; margin-top: 25px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>IAW Settlement Rail</h1>
            <p class="subtitle">Live On-Chain Hook Execution Engine</p>
        </header>

        <div class="card">
            <label>Target Hook Rail Address</label>
            <input type="text" value="r4QwJKuszDorGjzWqcDoHvxhkadKMeiitr" readonly style="color: var(--success); font-weight: bold;">

            <label>Test Transfer Amount (XRP)</label>
            <input type="number" id="amount" value="10" min="1">

            <button onclick="triggerSimulation()">Simulate Hook Routing</button>

            <pre id="log">[READY] Click the button above to simulate institutional routing and fee harvest.</pre>
        </div>
    </div>

    <script>
        const HOOK_ACCOUNT = "r4QwJKuszDorGjzWqcDoHvxhkadKMeiitr";

        function triggerSimulation() {
            const amt = document.getElementById('amount').value;
            const log = document.getElementById('log');
            const fee = (amt * 0.0033).toFixed(4);
            const net = (amt - fee).toFixed(4);

            log.innerText = `[CONNECT] Connecting to XRPL Hooks Testnet...\n`;
            setTimeout(() => {
                log.innerText += `[INGESTION] Received ${amt} XRP payment at rail target (${HOOK_ACCOUNT}).\n`;
            }, 400);
            setTimeout(() => {
                log.innerText += `[HOOK EXECUTION] C-Logic Triggered: Harvesting 0.33% fee (${fee} XRP) -> IAW Treasury.\n`;
            }, 900);
            setTimeout(() => {
                log.innerText += `[STATE LOCK] 1:1 shadow collateral updated successfully.\n`;
            }, 1400);
            setTimeout(() => {
                log.innerText += `[SUCCESS] Net delivery (${net} XRP) forwarded. State verified.`;
            }, 1900);
        }
    </script>
</body>
</html>
